<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-label="Student Records entity relationship diagram"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#61748c"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#243247}.title{font-size:27px;font-weight:700}.label{font-size:15px;fill:#62758d}.head{font-size:18px;font-weight:700;fill:#fff}.field{font-family:Consolas,monospace;font-size:14px}.line{fill:none;stroke:#61748c;stroke-width:2}</style><text class="title" x="55" y="47">Student Records — entity relationship diagram</text><text class="label" x="55" y="75">Six persistent tables · account ownership and academic record relationships</text><rect x="55" y="120" width="330" height="188" rx="5" fill="#f7f9fc" stroke="#cfdae7"/><path d="M60 120H380Q385 120 385 125V162H55V125Q55 120 60 120" fill="#203752"/><text class="head" x="73" y="148">Courses</text><text class="field" x="73" y="187">PK course_id</text><text class="field" x="73" y="213">UQ course_code</text><text class="field" x="73" y="239">course_name</text><text class="field" x="73" y="265">duration_years</text><text class="field" x="73" y="291">description</text><rect x="530" y="120" width="350" height="240" rx="5" fill="#f7f9fc" stroke="#cfdae7"/><path d="M535 120H875Q880 120 880 125V162H530V125Q530 120 535 120" fill="#203752"/><text class="head" x="548" y="148">Students</text><text class="field" x="548" y="187">PK student_id</text><text class="field" x="548" y="213">UQ student_number</text><text class="field" x="548" y="239">UQ email</text><text class="field" x="548" y="265">first_name, last_name</text><text class="field" x="548" y="291">phone, date_of_birth, address</text><text class="field" x="548" y="317">status: Active / Inactive</text><text class="field" x="548" y="343">FK course_id → Courses</text><rect x="1020" y="120" width="325" height="214" rx="5" fill="#f7f9fc" stroke="#cfdae7"/><path d="M1025 120H1340Q1345 120 1345 125V162H1020V125Q1020 120 1025 120" fill="#203752"/><text class="head" x="1038" y="148">Users</text><text class="field" x="1038" y="187">PK user_id</text><text class="field" x="1038" y="213">UQ username, UQ email</text><text class="field" x="1038" y="239">password_hash, full_name</text><text class="field" x="1038" y="265">role: Admin / Student</text><text class="field" x="1038" y="291">UQ FK student_id → Students</text><text class="field" x="1038" y="317">is_active</text><rect x="55" y="545" width="330" height="188" rx="5" fill="#f7f9fc" stroke="#cfdae7"/><path d="M60 545H380Q385 545 385 550V587H55V550Q55 545 60 545" fill="#203752"/><text class="head" x="73" y="573">Units</text><text class="field" x="73" y="612">PK unit_id</text><text class="field" x="73" y="638">UQ unit_code</text><text class="field" x="73" y="664">unit_name</text><text class="field" x="73" y="690">credit_points</text><text class="field" x="73" y="716">FK course_id → Courses</text><rect x="530" y="545" width="350" height="214" rx="5" fill="#f7f9fc" stroke="#cfdae7"/><path d="M535 545H875Q880 545 880 550V587H530V550Q530 545 535 545" fill="#203752"/><text class="head" x="548" y="573">Enrolments</text><text class="field" x="548" y="612">PK enrolment_id</text><text class="field" x="548" y="638">FK student_id → Students</text><text class="field" x="548" y="664">FK unit_id → Units</text><text class="field" x="548" y="690">semester, academic_year</text><text class="field" x="548" y="716">enrolment_date, status</text><text class="field" x="548" y="742">UQ student + unit + term</text><rect x="1020" y="545" width="325" height="162" rx="5" fill="#f7f9fc" stroke="#cfdae7"/><path d="M1025 545H1340Q1345 545 1345 550V587H1020V550Q1020 545 1025 545" fill="#203752"/><text class="head" x="1038" y="573">Results</text><text class="field" x="1038" y="612">PK result_id</text><text class="field" x="1038" y="638">UQ FK enrolment_id</text><text class="field" x="1038" y="664">mark: 0–100</text><text class="field" x="1038" y="690">grade: HD / D / C / P / F</text><path class="line" d="M385 219H530"/><text class="label" x="399" y="208">1</text><text class="label" x="490" y="208">0..*</text><path class="line" d="M220 308V545"/><text class="label" x="231" y="335">1</text><text class="label" x="231" y="530">0..*</text><path class="line" d="M880 228H1020"/><text class="label" x="893" y="215">1</text><text class="label" x="977" y="215">0..1</text><text class="label" x="902" y="254">Student role</text><path class="line" d="M705 360V545"/><text class="label" x="717" y="388">1</text><text class="label" x="717" y="530">0..*</text><path class="line" d="M385 660H530"/><text class="label" x="399" y="648">1</text><text class="label" x="490" y="648">0..*</text><path class="line" d="M880 660H1020"/><text class="label" x="893" y="648">1</text><text class="label" x="977" y="648">0..1</text><text class="label" x="55" y="865">PK = primary key · FK = foreign key · UQ = unique constraint · All tables include created_at and updated_at.</text><text class="label" x="55" y="894">Student accounts require a student link. Admin accounts have no student link. Enrolment deletion cascades to its result.</text></svg>