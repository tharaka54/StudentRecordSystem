<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="940" viewBox="0 0 1100 940" role="img" aria-label="Student Records system architecture"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#61748c"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#243247}.title{font-size:27px;font-weight:700}.label{font-size:15px;fill:#62758d}.head{font-size:18px;font-weight:700;fill:#fff}.field{font-family:Consolas,monospace;font-size:14px}.line{fill:none;stroke:#61748c;stroke-width:2}</style><text class="title" x="55" y="48">Student Records — system architecture</text><text class="label" x="55" y="79">Local browser application with server-enforced account and record access</text><rect x="100" y="120" width="420" height="110" rx="5" fill="#f4f7fb" stroke="#cbd7e6"/><text x="120" y="152" font-size="19" font-weight="700">Admin browser</text><text class="label" x="120" y="180">Academic management and account controls</text><text class="label" x="120" y="203">HTML, CSS and JavaScript</text><rect x="580" y="120" width="420" height="110" rx="5" fill="#f4f7fb" stroke="#cbd7e6"/><text x="600" y="152" font-size="19" font-weight="700">Student browser</text><text class="label" x="600" y="180">Personal academic records and password changes</text><text class="label" x="600" y="203">HTML, CSS and JavaScript</text><path class="line" marker-end="url(#arrow)" d="M310 230V275H550V310"/><path class="line" d="M790 230V275H550"/><text class="label" x="590" y="298">Same-origin HTTP / JSON</text><rect x="230" y="310" width="640" height="110" rx="5" fill="#f4f7fb" stroke="#cbd7e6"/><text x="250" y="342" font-size="19" font-weight="700">Go HTTP server and access controls</text><text class="label" x="250" y="370">Embedded interface · session authentication · CSRF and origin checks</text><text class="label" x="250" y="393">Admin / Student authorisation · student ID from authenticated account</text><path class="line" marker-end="url(#arrow)" d="M550 420V472"/><rect x="230" y="472" width="640" height="120" rx="5" fill="#f4f7fb" stroke="#cbd7e6"/><text x="250" y="504" font-size="19" font-weight="700">Application operations</text><text class="label" x="250" y="532">Validated CRUD · account management · personal academic summary</text><text class="label" x="250" y="555">Automatic grades · credit-weighted WAM · transactional result updates</text><text class="label" x="250" y="578">Parameterised search and pagination</text><path class="line" marker-end="url(#arrow)" d="M550 592V645"/><rect x="230" y="645" width="640" height="92" rx="5" fill="#f4f7fb" stroke="#cbd7e6"/><text x="250" y="677" font-size="19" font-weight="700">Persistence layer</text><text class="label" x="250" y="705">database/sql + modernc.org/sqlite · foreign keys · WAL</text><path class="line" marker-end="url(#arrow)" d="M550 737V790"/><rect x="230" y="790" width="640" height="93" rx="5" fill="#f4f7fb" stroke="#cbd7e6"/><text x="250" y="822" font-size="19" font-weight="700">SQLite database file</text><text class="label" x="250" y="850">Users · Students · Courses · Units · Enrolments · Results</text><text class="label" x="230" y="922">Sessions remain in server memory; academic data persists in SQLite.</text></svg>